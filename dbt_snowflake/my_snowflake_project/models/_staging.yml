version: 2

sources:
  - name: public
    # Logical name used in source() calls
    database: training_db
    schema: public
    tables:

      - name: orders
        description: 'Raw orders loaded from the e-commerce platform'
        loaded_at_field: updated_at
        # Field used for freshness checks
        freshness:
          warn_after: {count: 12, period: hour}
          # Warn if no new data in 12 hours
          error_after: {count: 24, period: hour}
          # Error if no new data in 24 hours
        columns:
          - name: order_id
            description: 'Primary key for orders'
            tests:
              - not_null
              - unique

          - name: customer_id
            description: 'Foreign key to customers table'
            tests:
              - not_null

          - name: order_date
            description: 'Date the order was placed'
            tests:
              - not_null
    
          - name: total_amount
            description: 'Total amount of the order'
            tests:
              - not_null

      - name: customers
        description: 'Raw customer records from CRM'
        loaded_at_field: updated_at